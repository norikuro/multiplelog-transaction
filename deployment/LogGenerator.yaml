apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
      - name: log-generator
        image: alikingdom/loggeneator:0.7
        env:
        - name: DT_URL
          valueFrom:
            secretKeyRef:
              name: dt-details
              key: DT_ENDPOINT
        - name: DT_LOG_INGEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: dt-details
              key: DT_LOG_INGEST_TOKEN